
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificates | Jenefer's Portfolio</title>
    <link rel="stylesheet" href="folder-style.css">
</head>
<body>

<div class="cursor-glow"></div>
<div class="cursor-orb"></div>

<main class="notion-container">

    <a href="index.html#portfolio" class="back-btn">← Back to Dashboard</a>

    <h1 class="page-title">✧ Certificates</h1>

    <p class="page-description">
        Certificates and recognitions from seminars, workshops, and learning experiences.
    </p>

    <div class="certificate-grid">

        <!-- CERTIFICATE 1 -->
        <div class="certificate-card">

            <img src="Certificate1.png"
                 class="certificate-image"
                 data-certificate
                 data-title="Certificate 1"
                 alt="Certificate 1"
                 loading="lazy">

            <div class="certificate-details">
                <h3>Certificate 1</h3>
                <p>Seminar / Workshop / Training</p>

                <button class="doc-btn"
                        onclick="document.querySelector('.certificate-image').click()">
                    View Certificate
                </button>
            </div>

        </div>

        <!-- CERTIFICATE 2 -->
        <div class="certificate-card">

            <img src="Certificate2.png"
                 class="certificate-image"
                 data-certificate
                 data-title="Certificate 2"
                 alt="Certificate 2"
                 loading="lazy">

            <div class="certificate-details">
                <h3>Certificate 2</h3>
                <p>Seminar / Workshop / Training</p>

                <button class="doc-btn"
                        onclick="this.closest('.certificate-card').querySelector('.certificate-image').click()">
                    View Certificate
                </button>
            </div>

        </div>

    </div>

    <footer class="page-footer">
        DCIT 26 Academic Portfolio<br>
        Jenefer Z. Ignacio | BSCS - 3A
    </footer>

</main>

<button class="scroll-top-btn" aria-label="Scroll to top">↑</button>

<script src="folder-effects.js"></script>
</body>
</html>
